<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- google fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <!-- font awesome cdn -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- tailwind cdn -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <header>
      <nav class="container border-b border-pink-500 p-2">
        <figure class="flex justify-center">
          <a href="./index.html"><img src="./assets/images/logo.png" alt="logo" /></a>
        </figure>
      </nav>
    </header>
    <main class="h-[300px]">
      <div class="flex items-center">
        <img
          class="w-[full] h-[320px] p-4"
          src="./assets/images/pandas.jpg"
          alt=""
        />
        <div>
          <h4>Your Order Is Being Recorded!</h4>
          <h2 class="text-4xl text-pink-600">Thank You!</h2>
          <button class="btn btn-xs p-2 mt-2">
            <a href="https://ecourier.com.bd/tracking/"><i class="fa-solid fa-location-dot"></i> Track Your Parcel</a>
          </button>
        </div>
       
    </main>
    <footer>
      <section class="bg-white">
        <div class="mt-6">
          <div
            class="container bg-[#fff2f1] h-[300px] flex flex-col items-center justify-center rounded-2xl"
          >
            <h2 class="font-semibold">Subscribe to get new product updates</h2>
            <div class="join flex mt-4">
              <div>
                <label class="input validator join-item">
                  <input type="email" placeholder="mail@site.com" required />
                </label>
                <div class="validator-hint hidden">
                  Enter valid email address
                </div>
              </div>
              <button class="btn btn-neutral join-item">Subscribe</button>
            </div>
          </div>
          <aside>
            <p class="text-center">
              Copyright © - All right reserved by PANDA Industries Ltd
            </p>
          </aside>
        </div>
      </section>
    </footer>
  </body>
</html>
